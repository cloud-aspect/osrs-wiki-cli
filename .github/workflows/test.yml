name: osrs-wiki-cli Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly to validate wiki examples still work
    - cron: '0 10 * * 1'  # Every Monday at 10 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        
    - name: Test CLI help
      run: |
        python wiki_tool.py --help
        python wiki_tool.py source --help
        python wiki_tool.py category --help
        
    - name: Test real wiki data extraction
      run: |
        echo "Testing Module extraction..."
        python wiki_tool.py source "Module:SlayerConsts/MasterTables" --format json
        
        echo "Testing Calculator extraction..."
        python wiki_tool.py source "Calculator:Combat level" --format json
        
        echo "Testing Template extraction..."  
        python wiki_tool.py source "Template:Infobox Item" --format text
        
        echo "Testing Category listing..."
        python wiki_tool.py category "Calculators" --limit 5 --format json
        
    - name: Test batch extraction
      run: |
        python batch_extract.py
        
    # Only run on main branch and scheduled runs
    - name: Validate documentation examples
      if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
      run: |
        echo "Validating all README examples work..."
        
        # Test examples from README.md
        python wiki_tool.py source "Calculator:Agility" --templates --format text
        python wiki_tool.py category "Items" --format csv --limit 50
        
        # Test examples from docs
        python wiki_tool.py source "Calculator:Slayer/Slayer task weight" --templates --format json
        
        echo "All documentation examples validated!"

  # Check for any broken links in documentation
  docs-validation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/mlc_config.json'