name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

jobs:
  # First run tests to ensure quality
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Test CLI functionality
        run: |
          python wiki_tool.py --help
          python wiki_tool.py source "Template:Infobox Item" --format json

  # Build and publish to PyPI using Trusted Publishers (OIDC)
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # REQUIRED: Grant OIDC token permissions for trusted publishing
    permissions:
      id-token: write  # For PyPI trusted publishing
      contents: read   # For repository access

    steps:
      - uses: actions/checkout@v7

      - name: Clean dist directory and attestations
        run: |
          rm -rf dist/
          mkdir -p dist

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Extract version from setup.py
        id: get_version
        run: |
          # Extract version from setup.py
          VERSION=$(python setup.py --version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build package
        run: |
          python -m build

      - name: Publish to Test PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Test install from Test PyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ osrs-wiki-cli || echo "Test install failed, continuing..."

      - name: Clean attestation files before main PyPI publish
        run: |
          rm -f dist/*.publish.attestation

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create development releases for testing using Trusted Publishing
  dev-publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    
    # REQUIRED: Grant OIDC token permissions for trusted publishing
    permissions:
      id-token: write  # For PyPI trusted publishing
      contents: read   # For repository access

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clean dist directory and attestations
        run: |
          rm -rf dist/
          mkdir -p dist

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Create development version
        id: dev_version
        run: |
          # Get base version from setup.py
          BASE_VERSION=$(python setup.py --version)

          # Get commit count since last tag for dev version
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Create development version: 1.0.0.dev123+abc1234
          DEV_VERSION="${BASE_VERSION}.dev${COMMIT_COUNT}+${SHORT_SHA}"
          echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT

          # Update version in setup.py for development build
          sed -i "s/version=\"$BASE_VERSION\"/version=\"$DEV_VERSION\"/" setup.py

          echo "Development version: $DEV_VERSION"

      - name: Build development package
        run: |
          python -m build

      - name: Publish development version to Test PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
